name: Tests and security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check commit whitespace
        run: git diff --check HEAD~1 HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            scripts/db_backup/backup/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix backend --ignore-scripts
      - run: npm ci --prefix frontend
      - run: npm run check:server
      - run: npm run test:turso
      - run: npm run build:vercel
      - run: npm ci --prefix scripts/db_backup/backup --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
      - name: Audit locked production dependencies
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --prefix backend --omit=dev --audit-level=moderate
          npm audit --prefix frontend --omit=dev --audit-level=moderate
          npm audit --prefix scripts/db_backup/backup --omit=dev --audit-level=moderate
      - run: git diff --check
