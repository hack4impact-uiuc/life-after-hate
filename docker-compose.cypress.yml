# Legacy Cypress development setup. The maintained CI suite is frontend/e2e (Playwright).
services:
  frontend:
    extends:
      file: docker-compose.yml
      service: frontend
  backend:
    extends:
      file: docker-compose.yml
      service: backend
    environment:
      NODE_ENV: test
      BYPASS_AUTH_ROLE: ADMIN
  db:
    extends:
      file: docker-compose.yml
      service: db
volumes:
  fe_modules:
  be_modules:
  mongo_data:
