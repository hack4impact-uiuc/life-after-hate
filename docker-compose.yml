# Local development only. Production uses a private authenticated database.
services:
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:3000"]
    environment:
      API_PROXY_TARGET: http://backend:5000
      VITE_MAPBOX_ACCESS_TOKEN: ${VITE_MAPBOX_ACCESS_TOKEN:-}
    volumes:
      - ./frontend:/var/www/app
      - fe_modules:/var/www/app/node_modules
    depends_on: [backend]
  backend:
    build: ./backend
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 5000
      BYPASS_AUTH_ROLE: ${BYPASS_AUTH_ROLE:-}
    volumes:
      - ./backend:/var/www/app
      - ./assets:/var/www/assets:ro
      - be_modules:/var/www/app/node_modules
    command: npm run start:dev
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mongo:8.0
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No published database port. Only containers on this Compose network can reach it.
volumes:
  fe_modules:
  be_modules:
  mongo_data:
