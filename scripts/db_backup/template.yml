Description: Private encrypted MongoDB backups using Secrets Manager and a maintained tools layer.
Transform: AWS::Serverless-2016-10-31
Parameters:
  MongoSecretArn:
    Type: String
    Description: Secrets Manager secret containing a JSON object with a uri field.
  S3Bucket:
    Type: String
    Description: Private, versioned backup bucket with Block Public Access enabled.
  BackupKmsKeyArn:
    Type: String
  MongoToolsLayerArn:
    Type: String
    Description: Reviewed x86_64 Linux MongoDB Database Tools layer exposing /opt/bin/mongodump.
  EmailAddress:
    Type: String
Resources:
  BackupFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: backup.handler
      Runtime: nodejs24.x
      Architectures: [x86_64]
      CodeUri: backup/
      Layers: [!Ref MongoToolsLayerArn]
      MemorySize: 2048
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          MONGO_SECRET_ARN: !Ref MongoSecretArn
          S3_BUCKET: !Ref S3Bucket
          BACKUP_KMS_KEY_ARN: !Ref BackupKmsKeyArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref MongoSecretArn
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub arn:${AWS::Partition}:s3:::${S3Bucket}/backups/*
            - Effect: Allow
              Action: [kms:GenerateDataKey, kms:Decrypt]
              Resource: !Ref BackupKmsKeyArn
      Events:
        Daily:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 * * ? *)
      EventInvokeConfig:
        DestinationConfig:
          OnFailure:
            Type: SNS
            Destination: !Ref SNSFailureTopic
  SNSFailureTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Endpoint: !Ref EmailAddress
          Protocol: email
